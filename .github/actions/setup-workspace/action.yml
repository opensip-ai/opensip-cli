# Shared install + two-pass build for CI.
# Warm parallel lanes restore a workspace packed by the `setup` job (see ci.yml)
# rather than each re-running this composite. cold-gate still uses install+build
# here (or inline steps) without the shared artifact.
#
# Pinned third-party actions (bump via Dependabot github-actions or deliberate review):
#   pnpm/action-setup@v6       → 0ebf47130e4866e96fce0953f49152a61190b271
#   actions/setup-node@v6      → 48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
#   actions/cache@v4.3.0       → 0057852bfaa89a56745cba8c7296529d2fc39830
name: Setup workspace
description: Install frozen lockfile, clean dist, build via scripts/build-ci.mjs, optional Turbo local cache

inputs:
  turbo-cache-key-suffix:
    description: >
      Extra key segment for the Turbo local cache (usually github.job) so lanes
      do not clobber each other's incomplete cache entries mid-run.
    required: false
    default: shared
  restore-turbo-cache:
    description: Whether to restore/save .turbo for this lane
    required: false
    default: 'true'
  run-build:
    description: >
      When 'true' (default), clean dist and run scripts/build-ci.mjs.
      Set 'false' only after a verified workspace restore that already includes dist.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        # Single source of truth: .nvmrc (kept in lockstep with engines.node).
        node-version-file: .nvmrc
        cache: pnpm

    - name: Turbo local cache
      if: inputs.restore-turbo-cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.turbo-cache-key-suffix }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ inputs.turbo-cache-key-suffix }}-
          ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Clean every package's dist/ before build so dogfood gates never execute a
    # stale or Turbo-cache-restored binary that lags the source.
    - name: Clean dist
      if: inputs.run-build == 'true'
      shell: bash
      run: pnpm -r run clean

    # Two-pass build that re-syncs pnpm's injected workspace copies between
    # passes (see scripts/build-ci.mjs).
    - name: Build
      if: inputs.run-build == 'true'
      shell: bash
      run: node scripts/build-ci.mjs
